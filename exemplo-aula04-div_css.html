<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: div, br e hr</title>

    <style>
        div {
             font-size: 28px;
             text-align: center; 
             padding: 20px;
             margin: 20px;
             border-radius: 10px;
        }
        #principal {
            background-color: skyblue;
            border: 10px solid rgb(179, 120, 255);
            color: rgb(88, 88, 88);
        }
        hr{
            border: 8px solid rgb(245, 98, 98);
            border-top: 3px solid pink;
            width: 80%;
        }


    </style>



</head>

<body>
    <div id = "principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id = "secundaria">
        Esta é a outra duvisão de página.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
